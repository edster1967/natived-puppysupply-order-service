##logging parameters to use for logback
logging.file.name=${LOG_FILE_PATH:logs/puppysupplyservice.log}

spring.jpa.hibernate.ddl-auto=none

spring.datasource.initialization-mode=always
spring.datasource.platform=postgres
## credentials are supplied via environment variables (see .env.example) - never commit real values
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/puppysupply}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
