##using a PostgreSQL database - credentials come from environment variables or the .env file
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/puppysupply}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

## runs schema-postgres.sql and data-postgres.sql on startup (scripts are idempotent)
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.platform=postgres
