## Optional .env file in the project root (see .env.example). Real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

## Database profile: "local" = H2 in-memory (default), "dev" = PostgreSQL
spring.profiles.active=${APP_PROFILE:local}
server.port=${SERVER_PORT:8080}

## Relative path so it works on both macOS/Linux and Windows
logging.file.name=${LOG_FILE_PATH:logs/puppysupplyservice.log}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
