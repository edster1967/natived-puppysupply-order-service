##using an H2 in-memory database for local development - no install required.
spring.datasource.url=jdbc:h2:mem:puppysupply;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${H2_USERNAME:sa}
spring.datasource.password=${H2_PASSWORD:}

## runs schema-h2.sql and data-h2.sql on startup
spring.sql.init.mode=always
spring.sql.init.platform=h2

##enabling H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
